    if(state.stage===3){card('Финальный выбор · 004',`<h2>ВЫБЕРИ<br><span class="gradient-text">ОДИН ПОДАРОК.</span> 🎁</h2><p class="desc">Внутри одной из коробок — секретное декабрьское послание. Содержимое неизвестно даже составителям анкеты. (Возможно.)</p><div class="gifts"><button class="gift" data-action="box" data-value="1" aria-label="Открыть первую коробку"><span class="gicon">🎁</span><strong>КОРОБКА 01</strong></button><button class="gift" data-action="box" data-value="2" aria-label="Открыть вторую коробку"><span class="gicon">🎁</span><strong>КОРОБКА 02</strong></button><button class="gift" data-action="box" data-value="3" aria-label="Открыть третью коробку"><span class="gicon">🎁</span><strong>КОРОБКА 03</strong></button></div><p class="note">👀 Не пытайся угадать. Департамент думал об этом слишком долго.</p>`,'FINAL');return}
    if(state.stage===4){card('Расшифровка протокола',`<div class="loader-emoji">🔍</div><h2 class="loading-title">ИДЁТ<br><span class="gradient-text">ПРОВЕРКА...</span></h2><p class="desc" style="text-align:center">Обрабатываем выбор. Сверяем с гостевым списком YUNGPO14.</p><div class="load-bar"><span id="bar"></span></div><p class="load-step" id="load-step">Проверка декабрьского расписания…</p>`,'99.9%');const texts=['Проверка декабрьского расписания…','Сканирование уровня легендарности…','Обнаружена Кристина. Совпадение: 100%.','Секретная коробка раскрыта!'];const bar=document.getElementById('bar'),line=document.getElementById('load-step');texts.forEach((t,i)=>loadTimers.push(setTimeout(()=>{if(state.stage===4){line.textContent=t;bar.style.width=`${(i+1)*25}%`}},i*570+80)));loadTimers.push(setTimeout(()=>{step(5);confetti()},2550));return}
    if(state.stage===5){card('Протокол рассекречен',`<div class="result"><div class="celebrate">🎉</div><div class="status"><span class="status-dot"></span> СЮРПРИЗ РАСКРЫТ</div><h2>БУ<svg aria-hidden="true" width="0" height="0"></svg>РЯТКА,<br><span class="gradient-text">ТЕБЯ ЗОВУТ В ГОСТИ!</span></h2><p class="desc">К YUNGPO14 в <strong>декабре, когда прилетишь</strong>. И да: какую бы коробку ты ни выбрала, там было одно и то же приглашение. АХАХА 🤝</p><div class="ticket" style="text-align:left"><div class="ticket-row"><span>YUNGPO14 PRESENTS</span><span>VIP · DEC 2026</span></div><div class="ticket-name">KRISTINA<br>AKA БУРЯТКА</div><div class="ticket-sub">ОФИЦИАЛЬНЫЙ ПРОПУСК В ГОСТИ</div><div class="ticket-line"></div><div class="ticket-meta"><div>КОГДА<br><strong>В декабре ❄️</strong></div><div>ПРОГРАММА<br><strong>Уют + смех</strong></div></div></div><div class="perks"><div class="perk"><b>🍕</b>Что-нибудь вкусное</div><div class="perk"><b>🎬</b>Фильм или музыка</div><div class="perk"><b>😂</b>Мемы без ограничений</div><div class="perk"><b>🧸</b>Максимальный уют</div></div><p class="desc" style="font-size:13px">Шуточный выбор закончился. <strong>А идти или нет — решать только тебе.</strong></p><button class="btn primary" data-action="reply" data-value="yes">Я В ДЕЛЕ, ЖДИТЕ БУРЯТКУ 😎</button><button class="btn secondary" data-action="reply" data-value="maybe">Я ПОДУМАЮ, МИНИСТР 👀</button><button class="btn secondary" data-action="reply" data-value="no">НЕ ПОЛУЧИТСЯ 🫶</button><p class="disclaimer">Никаких обязательств. Просто декабрьское приглашение от YUNGPO14 💜</p></div>`,'ПРОПУСК');return}
    if(state.stage===6){const replies={yes:{emoji:'🥳',title:'ВИЗИТ<br>ПРЕДВАРИТЕЛЬНО ОДОБРЕН!',msg:'YUNGPO14, на связи Кристина aka Бурятка. Залетаю в гости в декабре! 😎❄️ Давай договоримся о дне.',desc:'Ура! Вот готовый ответ, который можно отправить YUNGPO14.'},maybe:{emoji:'😌',title:'ДЕЛО<br>НА РАССМОТРЕНИИ',msg:'YUNGPO14, это Бурятка. Приглашение оценила, насчёт декабря ещё подумаю 👀',desc:'Никакой спешки. Решение остаётся за тобой.'},no:{emoji:'🫶',title:'ОТВЕТ<br>ПРИНЯТ БЕЗ ВОПРОСОВ',msg:'YUNGPO14, спасибо за приглашение! В декабре в гости не получится 🫶',desc:'Всё хорошо — это просто приглашение, а не приказ.'}};const r=replies[state.reply];card('Ответ на приглашение',`<div class="reply"><div class="hero-emoji" aria-hidden="true">${r.emoji}</div><h2>${r.title}</h2><p class="desc">${r.desc}</p><div class="reply-preview" id="reply-preview">${r.msg}</div><button class="btn primary" data-action="share">📨 ОТПРАВИТЬ ОТВЕТ</button><button class="btn secondary" data-action="copy">📋 СКОПИРОВАТЬ ТЕКСТ</button><button class="btn secondary" data-action="back">← НАЗАД К ПРИГЛАШЕНИЮ</button></div>`,'ГОТОВО');return}
  }
  function confetti(){if(prefersReducedMotion)return;const colors=['#ff7fc6','#e3c8ff','#96f0d6','#ffd380','#8c9dff'];for(let i=0;i<58;i++){const c=document.createElement('span');c.className='confetti';c.style.setProperty('--left',`${(i*73+Math.random()*30)%100}%`);c.style.setProperty('--w',`${5+Math.random()*7}px`);c.style.setProperty('--h',`${6+Math.random()*12}px`);c.style.setProperty('--radius',i%3?'2px':'50%');c.style.setProperty('--color',colors[i%colors.length]);c.style.setProperty('--duration',`${2.7+Math.random()*2.3}s`);c.style.setProperty('--cdelay',`${Math.random()*.6}s`);c.style.setProperty('--shift',`${(Math.random()-.5)*180}px`);c.style.setProperty('--rotation',`${(Math.random()-.5)*1100}deg`);document.body.appendChild(c);setTimeout(()=>c.remove(),5800)}}
  function showToast(text){clearTimeout(toastTimer);toast.textContent=text;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)}
  function getMessage(){return document.getElementById('reply-preview')?.textContent||''}
  async function copyMessage(){const message=getMessage();if(!message)return;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(message)}else{const t=document.createElement('textarea');t.value=message;t.style.position='fixed';t.style.top='-10000px';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw new Error('copy failed')}showToast('Ответ скопирован 💌')}catch(e){showToast('Выдели и скопируй текст из карточки 👆')}}
  async function shareMessage(){const message=getMessage();if(!message)return;try{if(navigator.share){await navigator.share({text:message,title:'Ответ YUNGPO14'})}else{await copyMessage()}}catch(e){if(e.name!=='AbortError')await copyMessage()}}
  app.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value||'';if(a==='next'){step(1)}else if(a==='identity'){state.identity=v;step(2)}else if(a==='plans'){state.plans=v;step(3)}else if(a==='box'){state.box=v;step(4)}else if(a==='reply'){state.reply=v;step(6)}else if(a==='back'){step(5)}else if(a==='copy'){void copyMessage()}else if(a==='share'){void shareMessage()}});
  render();
})();
